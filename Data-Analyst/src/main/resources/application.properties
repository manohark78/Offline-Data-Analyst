# =====================================================
# SERVER CONFIG
# =====================================================
server.port=8080
spring.application.name=Data-Analyst

# =====================================================
# FILE UPLOAD LIMITS
# Multipart file size limits for enterprise files
# =====================================================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=200MB
spring.servlet.multipart.max-request-size=210MB

# =====================================================
# DUCKDB STORAGE
# DB file stored in user's home directory.
# Data survives application restarts.
# =====================================================
app.duckdb.database-path=D:/manohar/Development/MyProject/.dataanalyst/analytics.duckdb

# =====================================================
# UPLOAD DIRECTORY
# Temporary staging for file upload before parsing.
# =====================================================
app.upload.temp-dir=D:/manohar/Development/MyProject/.dataanalyst/uploads

# =====================================================
# LOGGING ? keep minimal for production
# =====================================================
logging.level.com.enterprise.dataanalyst=INFO
logging.level.org.duckdb=WARN
logging.file.name=logs/app.log

app.llm.model-path=D:/manohar/Development/MyProject/Data Analyst/Data-Analyst/models/llama-3-8b/Meta-Llama-3-8B-Instruct.Q5_K_M.gguf
app.llm.max-tokens=512

# Reduce context ? saves memory and speeds up
app.llm.context-length=4096

# Keep temperature low ? deterministic = faster
app.llm.temperature=0.1

# GPU Offloading (Set to 0 if no GPU, or ~20-30 for 4GB VRAM)
app.llm.gpu-layers=20

# =====================================================
# DATA PROFILER
# Scans uploaded data to build column value profiles.
# Used by LLM Pass 2 for data-aware query generation.
# =====================================================
app.profiler.chunk-size=200
app.profiler.max-distinct-values=50
app.profiler.enabled=true

# =====================================================
# SMART ANALYST STRATEGY (Llama-3-8B)
# Pass 1: Schema-only (fast, ~5s)
# Pass 2: Data-aware Reasoning (fires only if Pass 1 fails, ~8-10s)
# Includes "Chain of Thought" for generic reasoning.
# =====================================================
app.llm.pass2.enabled=true
app.llm.pass2.max-tokens=512
